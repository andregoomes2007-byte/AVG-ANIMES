header{padding:36px 0 18px}

.search{position:relative;margin:20px 0 14px}
.search input{width:100%;padding:14px 16px 14px 46px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.search input:focus{border-color:var(--accent);outline:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}
.tab{flex:none;border:2px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.count{color:var(--muted);font-size:14px;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column}
.cover{aspect-ratio:3/4;display:grid;place-items:center;font-family:"Dela Gothic One",serif;font-size:96px;color:rgba(255,255,255,.92);position:relative}
.cover small{position:absolute;left:10px;bottom:8px;font-family:"Zen Maru Gothic",sans-serif;font-size:12px;font-weight:700;background:rgba(0,0,0,.35);color:#fff;padding:2px 8px;border-radius:999px}
.card .info{padding:12px 14px 14px}
.card h3{margin:0 0 4px;font-size:16px;line-height:1.25}
.card p{margin:0;color:var(--muted);font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.overlay{position:fixed;inset:0;background:rgba(10,12,35,.65);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--surface);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;position:relative}
@media (min-width:700px){.overlay{align-items:center}.modal{border-radius:20px}}
.mhead{height:150px;display:flex;align-items:flex-end;padding:18px 22px;color:#fff;position:relative}
.mhead h2{margin:0;font-family:"Dela Gothic One","Zen Maru Gothic",sans-serif;font-weight:400;font-size:clamp(22px,5vw,32px);line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:22px;cursor:pointer}
.mbody{padding:18px 22px 26px}
.mtabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px}
.mtab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 12px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.mtab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tags span{background:var(--tag);padding:3px 10px;border-radius:999px;font-size:13px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
dt{color:var(--muted)}dd{margin:0;font-weight:500}
.fav{margin-top:18px;padding:10px 18px;border-radius:999px;border:2px solid var(--accent);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.fav.on{background:var(--accent);color:var(--accent-ink)}
.mbody p{max-width:62ch;margin:0 0 12px}
header{margin-top:14px;padding:30px 24px 14px;border-radius:26px;background:linear-gradient(120deg,#FF5A8A,#8B5CF6 55%,#22B8E8);color:#fff}

.search input{border-color:transparent}

.count{margin-top:16px}

header{background:linear-gradient(120deg,#3B1646,#241A5C 55%,#0F3A57);border:1px solid var(--line)}

function art(a){
if(IMG[a.t])return `<img src="${IMG[a.t]}" alt="">`;
const r=rng(hsh(a.t)),g=a.g[0],p=PAL[g]||PAL["Aventura"],ac=a.g[1]&&PAL[a.g[1]]?PAL[a.g[1]][2]:p[2];
const R=(x,y)=>+(x+r()*(y-x)).toFixed(1),id="g"+hsh(a.t);
const sx=R(80,220),sy=R(80,170),sr=R(34,64);
let s=`<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs><rect width="300" height="400" fill="url(#${id})"/>`;
const sun=`<circle cx="${sx}" cy="${sy}" r="${sr}" fill="${p[2]}" opacity=".9"/>`;
const stars=n=>{let o="";for(let i=0;i<n;i++)o+=`<circle cx="${R(0,300)}" cy="${R(0,260)}" r="${R(.8,2.4)}" fill="#fff" opacity="${R(.4,.9)}"/>`;return o};
switch(g){
case"Ação":for(let i=0;i<20;i++){const t=i/20*6.283;s+=`<path d="M${sx} ${sy}L${sx+Math.cos(t)*500} ${sy+Math.sin(t)*500}L${sx+Math.cos(t+.1)*500} ${sy+Math.sin(t+.1)*500}Z" fill="${p[2]}" opacity=".18"/>`}s+=sun;break;
case"Aventura":s+=sun;for(let k=0;k<3;k++){let d=`M0 400V${R(250,300)}`;for(let x=40;x<=300;x+=R(40,70))d+=`L${x} ${R(200+k*35,270+k*30)}`;s+=`<path d="${d}L300 400Z" fill="${p[1]}" opacity="${.3+k*.25}"/>`}break;
case"Comédia":s+=sun;for(let i=0;i<26;i++){const c=[p[1],ac,"#fff",p[2]][i%4],x=R(0,300),y=R(0,400);s+=i%3?`<circle cx="${x}" cy="${y}" r="${R(5,18)}" fill="${c}" opacity=".75"/>`:`<rect x="${x}" y="${y}" width="${R(10,22)}" height="${R(6,12)}" rx="3" fill="${c}" opacity=".75" transform="rotate(${R(0,180)} ${x} ${y})"/>`}break;
case"Drama":s+=sun;for(let i=0;i<30;i++){const x=R(-20,320),y=R(0,380);s+=`<path d="M${x} ${y}l-14 ${R(30,60)}" stroke="#fff" stroke-width="1.4" opacity=".22"/>`}break;
case"Fantasia":s+=stars(30)+sun;for(let k=0;k<3;k++){const x=R(30,250),h=R(50,110);s+=`<path d="M${x} 400L${x+14} ${400-h}L${x+28} 400Z" fill="${ac}" opacity=".5"/>`}break;
case"Romance":s+=sun;for(let i=0;i<16;i++){const x=R(0,300),y=R(0,400);s+=`<ellipse cx="${x}" cy="${y}" rx="7" ry="14" fill="${i%2?"#fff":p[2]}" opacity="${R(.4,.8)}" transform="rotate(${R(0,180)} ${x} ${y})"/>`}break;
case"Sci-Fi":s+=stars(40)+sun+`<ellipse cx="${sx}" cy="${sy}" rx="${sr*1.7}" ry="${sr*.35}" fill="none" stroke="${ac}" stroke-width="3" transform="rotate(-18 ${sx} ${sy})"/>`;for(let i=1;i<9;i++)s+=`<path d="M0 ${300+i*i*1.8+i*6}H300" stroke="${p[0]}" opacity=".5"/>`;for(let i=-6;i<=6;i++)s+=`<path d="M${150+i*12} 300L${150+i*60} 400" stroke="${p[0]}" opacity=".4"/>`;break;
case"Suspense":for(let y=0;y<400;y+=24)s+=`<rect y="${y}" width="300" height="9" fill="#fff" opacity=".1"/>`;s+=`<circle cx="${sx}" cy="${sy}" r="${sr}" fill="none" stroke="${p[2]}" stroke-width="6"/><circle cx="${sx}" cy="${sy}" r="${sr*.38}" fill="${p[2]}"/>`;break;
case"Terror":s+=sun;for(let i=0;i<14;i++)s+=`<path d="M${R(0,300)} 0V${R(40,200)}" stroke="#B91C1C" stroke-width="${R(2,5)}" opacity=".6"/>`;{let d="M0 400V340";for(let x=0;x<=300;x+=20)d+=`L${x+10} ${R(300,350)}L${x+20} 345`;s+=`<path d="${d}V400Z" fill="#000" opacity=".6"/>`}break;
case"Esporte":for(let i=1;i<6;i++)s+=`<circle cx="${sx}" cy="${sy}" r="${sr+i*22}" fill="none" stroke="${p[2]}" stroke-width="3" opacity="${.5-i*.07}"/>`;s+=sun;for(let i=0;i<3;i++)s+=`<path d="M${-40+i*110} 400L${60+i*110} 220L${90+i*110} 220L${-10+i*110} 400Z" fill="#fff" opacity=".12"/>`;break;
case"Slice of Life":s+=sun;for(let i=0;i<3;i++)s+=`<circle cx="${R(20,280)}" cy="${R(40,200)}" r="${R(14,26)}" fill="#fff" opacity=".55"/>`;for(let k=0;k<2;k++)s+=`<ellipse cx="${R(60,240)}" cy="380" rx="${R(150,210)}" ry="${R(70,110)}" fill="${k?p[0]:ac}" opacity=".55"/>`;break;
case"Mecha":s+=sun;for(let i=0;i<7;i++){const x=R(0,260),y=R(0,340),w=R(30,90),h=R(20,70);s+=`<path d="M${x} ${y}h${w}l${R(8,20)} ${h}h-${w}z" fill="${i%2?p[2]:"#fff"}" opacity=".16"/>`}for(let i=0;i<5;i++)s+=`<path d="M0 ${R(0,400)}H300" stroke="${p[2]}" opacity=".3"/>`;break;
default:s+=sun+stars(14);for(let i=0;i<6;i++)s+=`<path d="M${R(0,300)} 400C${R(0,300)} ${R(200,330)} ${R(0,300)} ${R(100,250)} ${R(0,300)} 0" fill="none" stroke="${i%2?ac:"#fff"}" stroke-width="2.5" opacity=".4"/>`;
}
return s+`<text x="150" y="300" text-anchor="middle" font-family="Dela Gothic One,Zen Maru Gothic,sans-serif" font-size="140" fill="#fff" opacity=".93" stroke="rgba(0,0,0,.25)" stroke-width="6" style="paint-order:stroke">${a.k}</text></svg>`}
const EYE=`<svg class="e-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="e-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0112 19C5 19 1 12 1 12a18.5 18.5 0 015.1-5.9M9.9 5.1A10.9 10.9 0 0112 5c7 0 11 7 11 7a18.5 18.5 0 01-2.2 3.2M1 1l22 22"/></svg>`;
const cardH=({a,i})=>`<div class="cardw${seen.has(i)?" seen":""}" data-w="${i}"><button class="card" data-i="${i}"><div class="cover">${art(a)}<small>${a.f}</small></div><div class="info"><h3>${a.t}</h3><p>${a.g.join(", ")} · ${a.y}</p></div></button><span class="badge">Assistido</span><button class="eye" data-seen="${i}" aria-pressed="${seen.has(i)}" aria-label="Marcar ${a.t} como assistido" title="Marcar como assistido">${EYE}</button></div>`;
function renderTabs(){
$("tabs").innerHTML=tabs.map(n=>`<button class="tab" role="tab" aria-selected="${n===tab}" data-t="${n}" style="--c:${n==="Todos"?"#FFD23F":n==="Favoritos"?"#FF8FB1":n==="Assistidos"?"#34D399":PAL[n][0]}"><i></i>${n}${n==="Favoritos"?" ("+favs.size+")":n==="Assistidos"?" ("+seen.size+")":""}</button>`).join("");
}
function renderGrid(){
const r=list();
$("count").textContent=r.length+(r.length===1?" anime encontrado":" animes encontrados");
if(!r.length){$("grid").innerHTML=`<div class="empty">${tab==="Assistidos"&&!query?"Nenhum anime marcado como assistido. Toque no olhinho de uma capa para marcar.":tab==="Favoritos"&&!query?"Você ainda não favoritou nada. Abra um anime e toque em Favoritar.":"Nada encontrado. Tente outro nome ou gênero."}</div>`;return}
if(tab==="Todos"&&!query.trim()){
const f=r.filter(x=>x.a.sin),o=r.filter(x=>!x.a.sin);
$("grid").innerHTML=`<h2 class="sec">Destaques <small>com sinopse e guia completo</small></h2>`+f.map(cardH).join("")+`<h2 class="sec">Catálogo completo <small>${o.length} animes</small></h2>`+o.map(cardH).join("");
}else $("grid").innerHTML=r.sort((x,y)=>!!y.a.sin-!!x.a.sin).map(cardH).join("");
}
function toggleSeen(i){seen.has(i)?seen.delete(i):seen.add(i);saveSeen();const w=document.querySelector(`[data-w="${i}"]`);if(w){w.classList.toggle("seen",seen.has(i));w.querySelector(".eye").setAttribute("aria-pressed",seen.has(i))}renderTabs();if(tab==="Assistidos")renderGrid()}

const rows=[["Ano",a.y],["Estúdio",a.s],["Duração",a.e],["Formato",a.f]].filter(r=>r[1]);
const body={
sinopse:a.sin?`${tags}<p>${a.sin}</p><p><b>Clima:</b> ${a.vibe}</p>`:`${tags}<p>Este título ainda não tem sinopse escrita aqui. <a href="${mal}" target="_blank" rel="noopener" style="color:var(--accent)">Ver sinopse no MyAnimeList</a></p>`,
pra:a.pra?`<p><b>Pra quem é:</b> ${a.pra}</p><p><b>Por onde começar:</b> ${a.ini}</p>`:"",
onde:(()=>{const w=WATCH[a.t],jw=`https://www.justwatch.com/br/busca?q=${encodeURIComponent(a.t)}`;return (w?`<p><b>Disponível no Brasil (segundo fontes recentes):</b></p><div class="tags">${w.map(x=>`<span>${x}</span>`).join("")}</div>`:`<p>Ainda não confirmei em quais streamings este título está.</p>`)+`<p class="note">Os catálogos mudam com frequência. Confira a lista atualizada antes de assinar.</p><a class="btnlink" href="${jw}" target="_blank" rel="noopener">Ver onde assistir (JustWatch Brasil)</a>`})(),
ficha:`<dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}</dl>`
}[mtab];
const mt=[["sinopse","Sinopse"],...(a.pra?[["pra","Vale a pena?"]]:[]),["onde","Onde assistir"],["ficha","Ficha"]];
$("modal").innerHTML=`<div class="mhead">${art(a)}<button class="close" aria-label="Fechar">×</button><h2 id="mt">${a.t}</h2></div><div class="mbody"><div class="mtabs" role="tablist">${mt.map(([k,n])=>`<button class="mtab" role="tab" aria-selected="${k===mtab}" data-m="${k}">${n}</button>`).join("")}</div>${body}<button class="fav seenb ${seen.has(cur)?"on":""}" data-seenm aria-pressed="${seen.has(cur)}">${seen.has(cur)?"Assistido":"Marcar como assistido"}</button> <button class="fav ${on?"on":""}" data-fav aria-pressed="${on}">${on?"Favoritado":"Favoritar"}</button></div>`;
}
function closeModal(){$("ov").classList.remove("open")}

$("q").addEventListener("input",e=>{query=e.target.value;renderGrid()});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;tab=b.dataset.t;renderTabs();renderGrid()});
$("grid").addEventListener("click",e=>{const s=e.target.closest("[data-seen]");if(s)return toggleSeen(+s.dataset.seen);const c=e.target.closest("[data-i]");if(c)openModal(+c.dataset.i)});
$("ov").addEventListener("click",e=>{
if(e.target===$("ov")||e.target.closest(".close"))return closeModal();
const m=e.target.closest("[data-m]");if(m){mtab=m.dataset.m;drawModal();return}
if(e.target.closest("[data-seenm]")){toggleSeen(cur);drawModal();return}
if(e.target.closest("[data-fav]")){favs.has(cur)?favs.delete(cur):favs.add(cur);saveFavs();drawModal();renderTabs();renderGrid()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
$("ns").textContent=A.length;
$("wc").innerHTML=[3,1,5,0,4].map((i,k)=>`<div class="wc" style="--r:${(k-2)*7}deg;--y:${Math.abs(k-2)*10}px">${art(A[i])}</div>`).join("");
$("enter").onclick=()=>{$("welcome").classList.add("out");setTimeout(()=>{$("welcome").style.display="none"},400)};
renderTabs();renderGrid();$("enter").focus();
</script>
</body>
</html>
